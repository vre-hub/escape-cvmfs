# Rucio client configuration of the rbac-test instance.
# Same content as the rucio.cfg in the container image hdemule/rucio-clients-rbac, with one change:
# ca_cert uses $RUCIO_HOME (set by setup-tutorial.sh), so the file does not depend on the CVMFS folder name.
#
# There is no "account" setting. If your identity maps to one Rucio account, the server uses it.
# To choose another account, run: set-username <account>   (it sets RUCIO_ACCOUNT)
[client]
rucio_host = https://rbac-test-server.rucioit.cern.ch
auth_host = https://rbac-test-auth.rucioit.cern.ch
ca_cert = $RUCIO_HOME/etc/tls-ca-bundle.pem
auth_type = oidc
oidc_audience = rucio
oidc_polling = true
oidc_issuer = escape
oidc_scope = openid profile
auth_token_file_path = /tmp/rucio_oauth.token
