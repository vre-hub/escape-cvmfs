name: Build Yuki Tarball

on:
  workflow_dispatch:
    inputs:
      yuki_ref:
        description: Full Yuki commit SHA to build
        required: true
      celebi_ref:
        description: Full compatible Celebi commit SHA to bundle
        required: true
      rabbitmq_version:
        description: Optional conda-forge RabbitMQ version (empty selects current)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build-tarball:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Validate source revisions
        env:
          YUKI_REF: ${{ inputs.yuki_ref }}
          CELEBI_REF: ${{ inputs.celebi_ref }}
        run: |
          [[ "$YUKI_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CELEBI_REF" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout Yuki
        uses: actions/checkout@v4
        with:
          repository: CelebiProjects/Yuki
          ref: ${{ inputs.yuki_ref }}
          path: source-yuki

      - name: Checkout Celebi
        uses: actions/checkout@v4
        with:
          repository: CelebiProjects/Celebi
          ref: ${{ inputs.celebi_ref }}
          path: source-celebi

      - name: Install Miniforge build environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: yuki-build
          python-version: '3.11'
          channels: conda-forge

      - name: Install build tools
        shell: bash -el {0}
        run: python -m pip install --disable-pip-version-check conda-pack

      - name: Build tarball
        shell: bash -el {0}
        env:
          YUKI_SOURCE_DIR: ${{ github.workspace }}/source-yuki
          CELEBI_SOURCE_DIR: ${{ github.workspace }}/source-celebi
          PYTHON_BIN: python
          CONDA_BIN: conda
          CONDA_PACK_BIN: conda-pack
          RABBITMQ_VERSION: ${{ inputs.rabbitmq_version }}
        run: |
          chmod +x yuki/make_tarball.sh
          yuki/make_tarball.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuki
          path: |
            yuki/yuki-*.tar.gz
            yuki/yuki-*.tar.gz.sha256
          if-no-files-found: error
